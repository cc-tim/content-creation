# The office + hall: a Sylvanian-style dollhouse cutaway (open front and right), frozen v7
# (scene.js room, desk, chair, door, bookshelf). Spots: positions in metres, yaw in degrees.
picked: {date: "2026-10-13", source: "r7-3d frozen v7 (SHA256SUMS d9c61f63…5d75), scene.js room + desk + chair"}
spots:
  desk_seat: {pos: [0.85, 0.0, -0.5], seat: chair}          # TIM_X, TIM_Z: the swivel chair
  doorway_out: {pos: [-3.25, 0.0, -0.7], yaw: 90.0}         # in the hall, behind the door
  doorway_in: {pos: [-1.15, 0.0, -0.1], yaw: 90.0}          # just inside
  shelf_top: {pos: [-0.26, 1.04, -1.72]}                    # on the bookshelf, in frame every beat
  turntable: {pos: [1.85, 0.0, 0.65]}                       # open floor: the design views
# The door swings in on its beat, then rings on a spring (scene.js poseDoor), puffing dust.
door: {open: 1.9, rest: 1.62, decay: 7.0, freq: 26.0,
       dust: {span: [0.06, 0.9], grow: [0.4, 1.4], alpha: 0.7}}
# The laptop's code bars fill while the actor at desk_seat holds a pose flagged `typing`.
laptop: {spot: desk_seat, lines: 4, rate: 2.2, max_lines: 11, cursor_rate: 3.0}
